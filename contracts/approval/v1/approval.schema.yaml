$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.agent-platform.internal/approval/v1/approval.schema.yaml
title: Approval
description: >-
  คำตัดสินของผู้มีอำนาจว่าจะให้งานเดินต่อหรือไม่

  **semantics เป็นของ `devfactory-core`** — decision vocabulary และ guarantees ในไฟล์นี้
  แก้ที่นี่ไม่ได้ ต้องมี RFC ที่ repo นั้นก่อน (RFC-0005 Rule 2)
  ส่วนชื่อ field, type, โครงสร้างและ versioning เป็นของ `agent-platform` (Rule 1)

  **approval ≠ policy** — [`policy/v1`](../../policy/v1/) ตอบว่า "ต้องขออนุมัติไหม"
  ไฟล์นี้คือคำตัดสินของผู้มีอำนาจหลังจากนั้น

derived_from:
  repo: monthop-gmail/devfactory-core
  manifest: contract-semantics.yaml
  semantics_version: "1.5"
  rfcs:
    - rfcs/0002-governance-decision-contract.md
    - rfcs/0016-approval-subject-types.md
    - rfcs/0017-the-leaf-rule-is-not-a-property-of-one-contract.md
  license: MIT
  # ตรวจ drift โดยเทียบ semantics_version ไม่ใช่ SHA ของไฟล์ RFC
  # RFC เป็น prose — แก้คำผิดทำให้ SHA เปลี่ยนโดยไม่มีอะไร drift จริง

$defs:

  SubjectType:
    description: >-
      🔓 **ชุดเปิด** — 6 ค่านี้คือ *ขั้นต่ำที่ต้องมี* ไม่ใช่ชุดทั้งหมด
      (devfactory-core RFC-0016 · `semantics_version: "1.4"`)

      🔒 **เป็น semantics ของ `devfactory-core`** — ต่างจาก `event/v1` `$defs.SubjectType`
      ซึ่งชื่อเหมือนกันแต่ **เจ้าของคนละคน** · ของ `event` อยู่ใน `platform_may_add_freely`
      คือ enum เป็นของ `agent-platform` · ของที่นี่ไม่ใช่ **เพิ่มค่าต้องมี RFC ที่ต้นทาง**

      `record` = บันทึกของโดเมนที่ระบบเก็บไว้และต้องตามรอยได้ แต่**ไม่ได้เกิดจาก job**
      · ชนิดที่แท้จริงอยู่ใน `metadata.record_type` — platform ไม่รู้จักชนิดของโดเมน
      และไม่ควรรู้ · แยกจาก `artifact` ซึ่งเป็นผลผลิตของ execution
      · **ยืมนิยามจาก `event/v1` ทั้งดุ้น ไม่เขียนใหม่** — นิยามที่สองจะพาปัญหาที่
      RFC-0016 แก้กลับมา ([#73](https://github.com/monthop-gmail/agent-platform/issues/73))

      ⚠️ **`$defs` นี้ไม่ใช่สิ่งที่ field `subject.type` อ้าง** — field อ้าง `SubjectTypeName`
      เพราะถ้าอ้างที่นี่ ค่าที่อยู่นอกลิสต์จะ validate ไม่ผ่าน ซึ่งขัดกับ `closed: false`
      ของต้นทางและกับ [ADR-0006 Rule 2](../../../decisions/0006-contract-versioning.md)
      · รูปเดียวกับ `event/v1` `EventType` / `EventTypeName`
    enum:
      - job
      - execution
      - tool_call
      - artifact
      - deployment
      - record

  SubjectTypeName:
    description: >-
      สิ่งที่ field `subject.type` รับจริง — **ค่านอก `SubjectType` ใช้ได้**
      บังคับแค่ *รูปแบบชื่อ* ไม่ใช่ตัวค่า เพื่อให้ vocabulary โตได้ตาม ADR-0006 Rule 2
      โดยที่ชื่อยังอ่านรู้ว่าเป็นชนิดของสิ่งที่ถูกอนุมัติ ไม่ใช่ string อะไรก็ได้

      consumer ที่เจอค่าที่ไม่รู้จักต้องถือว่า **ยังไม่รู้จัก** ไม่ใช่เดาว่าเป็นค่าที่ใกล้เคียง
      — การเลือก "ค่าที่ผิดน้อยที่สุด" คือสิ่งที่ [#73](https://github.com/monthop-gmail/agent-platform/issues/73)
      รายงานว่าเกิดขึ้นจริงสองครั้งในโดเมนเดียว และ payload valid ทั้งสองครั้ง
    type: string
    pattern: '^[a-z][a-z0-9_]{2,63}$'
  Decision:
    description: >-
      🔒 frozen · **ชุดปิด** — vocabulary เป็นของ devfactory-core
      เพิ่ม ลบ หรือเปลี่ยนชื่อค่าใดค่าหนึ่ง = semantic change ต้องมี RFC ที่ repo นั้นก่อน

      **การเพิ่มค่ายังเป็น semantic change ที่นี่ ต่างจาก `event/v1` `$defs.EventType`
      ซึ่ง RFC-0009 เปิดให้เพิ่มได้** — ความต่างเป็นเจตนา ไม่ใช่ความไม่สม่ำเสมอ:
      outcome ของการอนุมัติแบบใหม่ เช่น `AUTO_APPROVE` หรือ `APPROVE_WITH_CONDITIONS`
      ที่ไม่มีใครตรวจ condition **เปิดทางให้ execution เดินโดยไม่มี APPROVE ของคนได้
      ด้วยการเพิ่มค่า ไม่ใช่การลบค่า** ซึ่งเป็นข้อ 6 ของ Rule 2 เอง
    enum:
      - APPROVE
      - REJECT
      - REQUIRE_CHANGES

type: object
required: [approval_id, tenant_id, subject, decision, reason, authority, decided_at]
properties:
  approval_id:
    $ref: https://schemas.agent-platform.internal/identity/v1/identity.schema.yaml#/$defs/Id

  tenant_id:
    $ref: https://schemas.agent-platform.internal/identity/v1/identity.schema.yaml#/$defs/TenantId
    description: >-
      🔒 invariant — decision ต้องอยู่ tenant เดียวกับสิ่งที่มันอนุมัติ
      ต่าง tenant = invalid ให้ **reject ไม่ใช่ coerce**
  workspace_id:
    $ref: https://schemas.agent-platform.internal/identity/v1/identity.schema.yaml#/$defs/WorkspaceId

  subject:
    type: object
    description: >-
      อนุมัติให้อะไร — `subject` ที่นี่คือ **สิ่งที่ถูกอนุมัติ** ไม่ใช่ผู้กระทำ
      และไม่ใช่เจ้าของข้อมูล ([ADR-0017](../../../decisions/0017-the-word-subject.md))
      🔒 เป็น semantics ของ devfactory-core — เปลี่ยนชื่อที่นี่ไม่ได้
    required: [type, id]
    properties:
      type:
        $ref: '#/$defs/SubjectTypeName'
      id:
        $ref: https://schemas.agent-platform.internal/identity/v1/identity.schema.yaml#/$defs/Id
  execution_id:
    $ref: https://schemas.agent-platform.internal/identity/v1/identity.schema.yaml#/$defs/ExecutionId
  agent_id:
    $ref: https://schemas.agent-platform.internal/identity/v1/identity.schema.yaml#/$defs/AgentId

  decision:
    $ref: '#/$defs/Decision'
  reason:
    type: string
    minLength: 1
    description: >-
      🔒 required meaning — เหตุผลที่ตัดสินอย่างนั้น
      ห้ามใส่ credential, PII หรือ private reasoning ของ model

      📣 **leaf ที่ประกาศแล้วว่าถือข้อความของคนได้** — RFC-0017 วินิจฉัยว่ากฎ leaf
      ของ RFC-0013 **ไม่ใช่คุณสมบัติของ `event/v1`** แต่เป็นคุณสมบัติของข้อความที่ลบไม่ได้
      เมื่อเขียนลงไปแล้ว จึงผูกใบนี้ด้วย (`semantics_version` `1.5`
      · [ADR-0034](../../../decisions/0034-semantics-1-5-leaf-declaration.md))

      เหตุที่เป็นตัวชี้ไม่ได้ — `required` + `minLength: 1` และ `required_meaning`
      ของต้นทางบังคับว่าต้องมี *"เหตุผลที่ตัดสินอย่างนั้น"* · **คำตัดสินที่ไม่มีเหตุผล
      ไม่ auditable**

      ⚠️ **ต่างจาก `event/v1` `transition.reason` ตรงที่ตัวนี้ตัดออกไม่ได้เลย**
      อีกใบเป็น optional ผู้ผลิตที่เห็นว่าไม่คุ้มค่าเก็บเลิกส่งได้ · ที่นี่สัญญาบังคับให้
      ประโยคนั้นมีอยู่ **สิ่งเดียวที่เปลี่ยนได้ตลอดอายุของมันคือคำตอบเรื่องชั้นของกฎการเก็บ**

      🔒 **ผู้ผลิตต้องประกาศว่ากติกาการเก็บและการลบอยู่ชั้นไหน** — `agent-platform`
      ประกาศแทนไม่ได้เพราะไม่ได้เป็นผู้เก็บใบอนุมัติของใคร
  authority:
    $ref: https://schemas.agent-platform.internal/identity/v1/identity.schema.yaml#/$defs/Principal
    description: >-
      🔒 required meaning — ผู้มีอำนาจที่รับผิดชอบคำตัดสินนี้
      **invariant:** agent ออก `APPROVE` ให้งานของตัวเองไม่ได้ ("no agent has total authority")
      — `authority.id` ต้องไม่ใช่ `agent_id` ของงานที่กำลังอนุมัติ

      ⚠️ **นี่คือ `Principal` — มันพา `display_name` มาด้วย และถ้า `type: human`
      ค่านั้นคือชื่อคนจริง** · คำกำกับเต็มอยู่ที่ตัวฟิลด์ใน
      [`identity/v1`](../../identity/v1/) ([ADR-0031](../../../decisions/0031-the-field-everyone-thought-was-someone-elses.md))
      — ผู้ผลิตควรตัดออกที่จุด emit รวม `on_behalf_of` ที่ซ้อนกัน

      เหตุที่เขียนซ้ำตรงนี้ทั้งที่คำเตือนเดินทางมากับ `Principal` อยู่แล้ว —
      `care-agent-platform` ขยายตัวไล่ leaf ให้ครอบใบอนุมัติหลังกฎ leaf ขยายขอบเขต
      มาถึง `approval/v1` (RFC-0017) แล้ว **ฟ้อง `$.authority.display_name` ในรอบแรกที่รัน**
      · เป็นรูปเดียวกับ `actor.display_name` ที่เขาปิดไปเมื่อ 11 ก.ย. เป๊ะ ต่างกันแค่
      อยู่คนละสัญญา และ **เขาไม่ได้ไปมองเพราะยังไม่มีอะไรบอกให้มอง**
  decided_at:
    type: string
    format: date-time
    description: 🔒 required meaning — เวลาที่ตัดสิน

  policy_id:
    type: string
    description: policy decision ที่ทำให้ต้องขออนุมัติ — ดู `policy/v1`
  action_risk:
    $ref: https://schemas.agent-platform.internal/capability/v1/capability.schema.yaml#/$defs/ActionRisk
  expires_at:
    type: string
    format: date-time
    description: >-
      approval ที่หมดอายุแล้วใช้เดินงานไม่ได้ ต้องขอใหม่
      งานที่ค้างรออนุมัติจนเลยกำหนดควรเข้าสถานะ timeout ไม่ใช่รอตลอดไป
  escalation_target:
    $ref: https://schemas.agent-platform.internal/identity/v1/identity.schema.yaml#/$defs/Principal
  correlation_id:
    $ref: https://schemas.agent-platform.internal/identity/v1/identity.schema.yaml#/$defs/Id
    description: >-
      ผูกใบอนุมัติเข้ากับสายงานเดียวกันข้าม service — ค่าเดียวกับที่ `event/v1` และ
      `identity/v1` `RequestContext` ใช้ ([ADR-0019](../../../decisions/0019-execution-records-its-approval.md))

      `execution_id` กับ `subject` ทำแทนไม่ได้ เพราะการอนุมัติหนึ่งครั้งอาจเกิดก่อน
      execution ถูกสร้าง หรือครอบหลาย execution ในสายเดียวกัน

      เป็น field ระดับ platform ตาม [ADR-0006 กฎข้อ 1](../../../decisions/0006-contract-versioning.md)
      — เพิ่มได้เองโดยไม่ต้องมี RFC ที่ repo ต้นทาง · `guarantees` ไม่ขยับ

  payload_digest:
    type: object
    description: >-
      ผูกใบอนุมัติเข้ากับ **เนื้อของสิ่งที่จะเกิดขึ้น** ไม่ใช่กับ id ของเรื่อง
      ([ADR-0035](../../../decisions/0035-approval-bound-to-an-id-is-not-bound-to-what-runs.md))

      `subject` `execution_id` `policy_id` `correlation_id` ทำแทนไม่ได้ — **ทั้งสี่ช่องเป็น id
      ของเรื่อง ไม่ใช่ของเนื้อ** · ใบที่ผูกด้วย id อนุมัติ *คำขอ* · ใบที่ผูกด้วย digest อนุมัติ
      *สิ่งที่จะเกิดขึ้น* — ต่างกันทันทีที่ argument เปลี่ยนระหว่างทางขณะที่ใบยังใช้ได้

      เป็น field ระดับ platform ตาม [ADR-0006 กฎข้อ 1](../../../decisions/0006-contract-versioning.md)
      — เพิ่มได้เองโดยไม่ต้องมี RFC ที่ repo ต้นทาง · `guarantees` ไม่ขยับ
      · รูปเดียวกับที่ `correlation_id` เข้ามา · `semantics_version` จึงไม่ขยับด้วย

      ⚠️ **ไม่มี field นี้ = ใบนี้ไม่ได้ผูกกับ payload ใด ไม่ได้แปลว่า payload ใดก็ได้**
      ผู้ตรวจที่เทียบ digest *เฉพาะเมื่อมี* จะผ่านทุกใบที่ไม่ส่งมา ซึ่งคือทางที่น่าจะถูกใช้มากที่สุด
      · รูปเดียวกับ `policy/v1` `Request.consent`

      🔒 การเปลี่ยน payload หลังอนุมัติไม่ใช่การแก้ใบ — `decision` immutable ตาม guarantee ข้อ 1
      ต้องเป็นใบใหม่ที่อ้าง `supersedes_approval_id` · **ใบที่แก้ digest ของตัวเอง
      คือใบที่ทำลายเหตุผลที่ตัวเองมีอยู่**

      วิธีคำนวณ digest **ไม่ใช่ของสัญญาใบนี้** — platform ไม่รู้จักโดเมนของผู้ผลิต
      จึงกำหนดให้ไม่ได้และไม่ควร (เหตุผลเดียวกับ [ADR-0030](../../../decisions/0030-the-field-nobody-named.md)
      `error/v1.details` และ [ADR-0033](../../../decisions/0033-resource-must-carry-its-own-scope.md) ข้อ 2)
    required: [algorithm, value, covers]
    properties:
      algorithm:
        enum: [sha256, sha512]
        description: >-
          รูปเดียวกับ `artifact/v1` `checksum.algorithm` — ประกาศที่นี่เพราะ
          **แฮชที่ไม่บอกอัลกอริทึม ย้ายอัลกอริทึมวันหน้าไม่ได้** ต้องเดาจากความยาว
      value:
        type: string
        minLength: 1
      covers:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
        description: >-
          🔒 **ประกาศว่าแฮชคลุมอะไร และต้องเป็นสิ่งที่คำนวณจริง** ไม่ใช่สิ่งที่อยากให้คนเชื่อว่าคลุม

          เหตุที่บังคับ — `model/v1` `platform_rules` บันทึกบั๊กรูปนี้ไว้แล้วว่า
          *"checksum ที่คำนวณจาก manifest อย่างเดียว บอกได้แค่ว่า manifest เหมือนกัน
          ไม่ได้บอกว่าสิ่งที่รันเหมือนกัน"* ([ADR-0023](../../../decisions/0023-frozen-bindings-and-identity.md))
          · **แฮชที่คลุมไม่ครบแล้วไม่บอก ให้ความมั่นใจมากกว่าที่มันมีสิทธิ์ให้**
          และแรงกว่าการไม่มีช่องเลย เพราะไม่มีช่องคือรู้ตัวว่าไม่มี

          🔒 **ถ้าลำดับมีผลต่อค่าแฮช ลำดับในลิสต์นี้ต้องเป็นลำดับที่ป้อนเข้าไปจริง**
          — สลับลำดับ = พฤติกรรมต่างกันภายใต้ความล้มเหลวเดียวกัน
          ([ADR-0025](../../../decisions/0025-provider-switch-and-what-identity-covers.md))

          `minItems: 1` เพราะลิสต์ว่างต้องแปลว่าว่าง ไม่ใช่แปลว่าคลุมทุกอย่าง

          ⚠️ **enum ของค่าในลิสต์นี้เป็นของผู้ผลิต** — platform บังคับได้แค่ว่าต้องมี
          · validator กลางตรวจไม่ได้ว่าลิสต์นี้พูดความจริง เกณฑ์ของผู้ผลิตต้องตรวจเอง

  supersedes_approval_id:
    $ref: https://schemas.agent-platform.internal/identity/v1/identity.schema.yaml#/$defs/Id
    description: >-
      approval ใบที่ใบนี้มาแทน — **ต้องมีเมื่อเป็นการเปลี่ยนใจ** ตาม guarantee ข้อแรก
      ใบเดิมยังคงอยู่และห้ามแก้ · ห่วงโซ่นี้คือหลักฐานว่าใครเปลี่ยนใจเมื่อไหร่ ด้วยเหตุผลอะไร

      approval ใบแรกของเรื่องหนึ่งไม่มี field นี้ — จึงเป็น optional
      **ไม่มี field นี้ ≠ ไม่ได้เปลี่ยนใจ** แต่แปลว่า *อ้างว่าเป็นใบแรก*

      invariant ที่ JSON Schema ตรวจให้ไม่ได้ ผู้ผลิตต้องบังคับเอง:
      ใบที่อ้างถึงต้องมีอยู่จริง อยู่ `tenant_id` เดียวกัน และมี `subject` เดียวกัน
      · ห้ามชี้ตัวเอง (`supersedes_approval_id` ≠ `approval_id`) และห้ามเป็นวง

guarantees:
  description: >-
    🔒 frozen — เป็นของ devfactory-core (RFC-0002)
    ลดหรือถอนข้อใดข้อหนึ่ง = semantic change ต้องมี RFC ที่ repo นั้นก่อน
  rules:
    - "decision เป็น immutable — แก้ไม่ได้หลังบันทึก · การเปลี่ยนใจคือ approval ใบใหม่ที่อ้างใบเดิม"
    - "ทุก APPROVE ต้อง auditable — ต้องมี event GOVERNANCE_DECISION คู่กันเสมอ"
    - "execution ที่ไม่มี APPROVE เป็นสิ่งที่ห้าม"
