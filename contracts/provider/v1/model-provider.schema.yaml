$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.agent-platform.internal/provider/v1/model-provider.schema.yaml
title: Model Provider
description: >-
  ผู้ให้บริการ model inference — OpenAI, Anthropic, Google, Qwen, DeepSeek, xAI, MiniMax (ADR-0004)
  ไม่มี workspace / shell / git — ถ้ามีแปลว่าเป็น agent provider

allOf:
  - $ref: https://schemas.agent-platform.internal/provider/v1/provider.schema.yaml
  - type: object
    required: [models]
    properties:
      kind:
        const: model
      models:
        type: array
        minItems: 1
        items:
          type: object
          required: [model_id]
          properties:
            model_id:
              type: string
              description: id ตามที่ provider เรียก — platform ไม่ normalize ชื่อ model
            display_name: { type: string }
            context_window_tokens: { type: integer, minimum: 1 }
            max_output_tokens: { type: integer, minimum: 1 }
            modalities:
              type: array
              items:
                enum: [text, image, audio, video]
            pricing:
              type: object
              properties:
                input_usd_per_mtok: { type: number, minimum: 0 }
                output_usd_per_mtok: { type: number, minimum: 0 }
            deprecated: { type: boolean, default: false }
